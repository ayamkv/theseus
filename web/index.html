<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#008229" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Lemonade" />
<title>Lemonade</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<style>
    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        /* The game window is a fixed-size canvas; scale it to the screen
           instead of letting it make the page scroll. */
        overflow: hidden;
        background: #000;
    }
    .window {
        border: solid 1px black;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 100vw;
        max-height: 100vh;
        image-rendering: pixelated;
        touch-action: manipulation;
    }
    canvas {
        image-rendering: pixelated;
    }
    #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(135deg, #009631 0 18px, #008229 18px 36px);
        /* Wait a moment before appearing so fast cached loads show no flash. */
        opacity: 0;
        animation: boot-in 0.15s ease 0.25s forwards;
    }
    #boot.done {
        animation: none;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
    }
    @keyframes boot-in {
        to {
            opacity: 1;
        }
    }
    .boot-window {
        min-width: 260px;
        padding: 3px;
        background: #009631;
        border: 1px solid #00280d;
        border-radius: 3px;
        box-shadow: inset 2px 2px 0 #a5d739, inset -2px -2px 0 #004918,
            4px 4px 0 rgba(0, 0, 0, 0.35);
        font: 700 13px/1.4 "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Verdana, sans-serif;
        color: #f7fbf7;
        text-shadow: 1px 1px 0 #004918;
    }
    .boot-title {
        padding: 4px 6px;
        margin-bottom: 8px;
        background: #004918;
        color: #a5d739;
        letter-spacing: 1px;
    }
    .boot-content {
        padding: 6px 10px 12px;
    }
    .boot-text {
        margin-bottom: 8px;
        white-space: nowrap;
    }
    #boot.error .boot-text {
        color: #ffa600;
        white-space: normal;
    }
    .boot-bar {
        height: 14px;
        padding: 2px;
        background: #008229;
        border: 1px solid #004918;
        box-shadow: inset 1px 1px 0 #004918, inset -1px -1px 0 #73cb21;
        overflow: hidden;
    }
    .boot-fill {
        width: 40%;
        height: 100%;
        background: repeating-linear-gradient(90deg, #a5d739 0 8px, #73cb21 8px 16px);
        animation: boot-slide 1.1s linear infinite;
    }
    #boot.error .boot-fill {
        animation: none;
        width: 100%;
        background: #ffa600;
    }
    @keyframes boot-slide {
        from {
            margin-left: -40%;
        }
        to {
            margin-left: 100%;
        }
    }
    .mobile-keyboard-toggle {
        display: none;
        position: fixed;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 10;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        appearance: none;
        cursor: pointer;
        color: #f7fbf7;
        background: #18ae31;
        border: 1px solid #00280d;
        border-radius: 3px;
        box-shadow: inset 2px 2px 0 #a5d739, inset -2px -2px 0 #004918,
            2px 2px 0 rgba(0, 0, 0, 0.45);
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    .mobile-keyboard-toggle::after {
        content: "";
        position: absolute;
        inset: -8px;
    }
    .mobile-keyboard-toggle svg {
        display: block;
        pointer-events: none;
    }
    .mobile-keyboard-toggle:active {
        background: #009631;
        box-shadow: inset 2px 2px 0 #004918, inset -2px -2px 0 #73cb21;
    }
    .mobile-keyboard-toggle:active svg {
        transform: translate(1px, 1px);
    }
    /* Phones and tablets only; a desktop has a real keyboard. */
    @media (pointer: coarse) {
        .mobile-keyboard-toggle {
            display: grid;
        }
    }
</style>
<div id="boot" role="progressbar" aria-label="Loading">
    <div class="boot-window">
        <div class="boot-title">LEMONADE</div>
        <div class="boot-content">
            <div class="boot-text">Loading…</div>
            <div class="boot-bar"><div class="boot-fill"></div></div>
        </div>
    </div>
</div>
<script type="module" src="host.js"></script>
