<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        /* The game window is a fixed-size canvas; scale it to the screen
           instead of letting it make the page scroll. */
        overflow: hidden;
        background: #000;
    }
    .window {
        border: solid 1px black;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 100vw;
        max-height: 100vh;
        image-rendering: pixelated;
        touch-action: manipulation;
    }
    canvas {
        image-rendering: pixelated;
    }
    .mobile-keyboard-toggle {
        display: none;
        position: fixed;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 10;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        appearance: none;
        cursor: pointer;
        color: #f7fbf7;
        background: #18ae31;
        border: 1px solid #00280d;
        border-radius: 3px;
        box-shadow: inset 2px 2px 0 #a5d739, inset -2px -2px 0 #004918,
            2px 2px 0 rgba(0, 0, 0, 0.45);
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    .mobile-keyboard-toggle::after {
        content: "";
        position: absolute;
        inset: -8px;
    }
    .mobile-keyboard-toggle svg {
        display: block;
        pointer-events: none;
    }
    .mobile-keyboard-toggle:active {
        background: #009631;
        box-shadow: inset 2px 2px 0 #004918, inset -2px -2px 0 #73cb21;
    }
    .mobile-keyboard-toggle:active svg {
        transform: translate(1px, 1px);
    }
    /* Phones and tablets only; a desktop has a real keyboard. */
    @media (pointer: coarse) {
        .mobile-keyboard-toggle {
            display: grid;
        }
    }
</style>
<script src="coi-serviceworker.min.js"></script>
<script type="module" src="host.js"></script>
